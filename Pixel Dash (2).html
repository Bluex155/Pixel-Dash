const levelCode = L => 'PD2:' + enc(L.name) + ':' + rleEnc(L.rows);

function parseCode(text) {
  const t = text.trim();
  if (t.startsWith('PD1:')) {
    const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));
    const nm = o.n || 'Niveau importé';
    return { type: 'level', name: nm, levels: [{ name: nm, rows: o.m }] };
  }
  if (t.startsWith('PD2:')) {
    const m = t.match(/^PD2:([^:]*):(.*)$/s);
    if (!m) throw new Error('Code PD2 invalide');
    const nm = decodeURIComponent(m[1]);
    return { type: 'level', name: nm, levels: [{ name: nm, rows: rleDec(m[2]) }] };
  }
  if (t.startsWith('PC2:')) {
    const m = t.match(/^PC2:([^:]*):(.*)$/s);
    if (!m) throw new Error('Code PC2 invalide');
    const levels = m[2].split('~').map(p => {
      const k = p.indexOf(':'); if (k < 0) throw new Error('Niveau invalide');
      return { name: decodeURIComponent(p.slice(0, k)), rows: rleDec(p.slice(k + 1)) };
    });
    return { type: 'chapter', name: decodeURIComponent(m[1]), levels };
  }
  throw new Error('Le code doit commencer par PD2: ou PC2:');
}

function libSave() { save('pd10_lib', JSON.stringify(lib)); }
function libAdd(type, name, code) {

  libSave();
}
function saveNow(kind, name) {

  if (toEditor) { edLevels = p.levels.map(L => ({ name: L.name, rows: L.rows })); edCur = 0; }

const CH_EN = ["The first slopes", "The wind of the pass", "The cold stones", "The blue glacier", "The red cliff", "The low clouds", "The forgotten ridge", "The silver caves", "The endless fog", "The hidden summit", "The echo ravine", "The eternal snows", "The storm", "The glass edges", "The lynx pass", "The golden peaks", "The star peak", "The last rope", "Mount Tom", "Beyond the clouds"];
const ROOM_CH_EN = ["The first slopes", "Two gaps and springs", "The stairs", "The labyrinth", "Springs and fragile floors", "The ice", "The air currents", "The blinking blocks", "Climbing", "Lasers and falling platforms", "Springs and lasers", "Variants", "New challenges"];
function buildEN() {
  CH_NAMES.forEach((f, i) => { if (CH_EN[i]) EN_MAP[f] = CH_EN[i]; });
  ROOM_CH.forEach((f, i) => { if (ROOM_CH_EN[i]) EN_MAP[f] = ROOM_CH_EN[i]; });
  STORY.forEach((f, i) => { if (STORY_EN[i]) EN_MAP[f] = STORY_EN[i]; });
}
let EN_KEYS = [];
function tr(s) {
  if (LANG !== 'en') return s;
  if (!EN_KEYS.length) EN_KEYS = Object.keys(EN_MAP).sort((a, b) => b.length - a.length);
  if (EN_MAP[s] !== undefined) return EN_MAP[s];
  for (const k of EN_KEYS) if (s.includes(k)) s = s.split(k).join(EN_MAP[k]);
  return s;
}
const STORY_EN = ["Tom, 9, wants to find the summit his grandfather described to him every night.", "The wind is cold, but Tom has his yellow hat and a brand-new ice axe.", "The stones seem to lead him upward, one by one.", "Under the glacier, a blue light pulses like a heart.", "The red cliff still holds the marks of old ropes.", "In the clouds, Tom thinks he hears his grandfather’s voice.", "Nobody has walked the forgotten ridge for years.", "The silver caves shine with every step.", "The fog hides the path, but the gems show the way.", "The summit may be closer than it looks.", "The echoes repeat his grandfather’s name.", "The snows are eternal, like the memory he is looking for.", "The storm is coming. Tom tightens the straps of his pack.", "The glass edges cut the sky in two.", "A white lynx appears and opens the way.", "The golden peaks light up as the sun sets.", "The star peak is right there, almost within reach.", "One last rope, one last step.", "At the top of Mount Tom, a notebook waits, open.", "Tom understands: the mountain was not keeping a secret, it was keeping his family."];
function drawGame() {
  ctx.save();
  if (shake > 0.3) ctx.translate(Math.round((Math.random() * 2 - 1) * shake), Math.round((Math.random() * 2 - 1) * shake));
  drawBG(roomMode ? roomPal(roomIdx) : palOf(idx));
  ctx.drawImage(levelCv, 0, 0);
  drawBlades();
  drawMovers();
  drawCrumbles();
  drawGate();
  drawDyn(); drawRemote();
  if (!P.dead) drawPlayer();
  drawParts();
  ctx.restore();
  if (P.dead) pixRect(0, 0, W, H, 'rgba(255,80,110,0.2)');

  const rec = roomMode ? undefined : best[idx];
  txt(roomMode ? (inCustom ? `Niveau perso ${roomIdx + 1}/${custom.length}` : `Salle ${roomIdx + 1}/${ROOMS.length} · ${ROOM_CH[chapOf(roomIdx)]}`) : `${idx + 1}. ${LVNAME(idx)}${tutoOn ? '  (tutoriel)' : ''}`, 18, 38, 24, '#ffffff', 'left');
  txt(`${fmt(levelT)} · Morts ${levelDeaths}${rec && rec.t !== undefined ? ' · Record ' + fmt(rec.t) : ''}`, 18, 64, 17, '#ffffff', 'left');
  txt(`Total ${fmt(runT)} · Morts ${deaths}${remote ? ' · Ami : ' + (remote.l >= 1000 ? 'salle ' + (remote.l - 999) : 'niveau ' + (remote.l + 1)) + ' · ' + lat + ' ms' : ''}`, 18, 88, 15, '#ffffff', 'left');
  txt('DASH', W - 60, 38, 16, '#ffffff', 'right');
  indicator(W - 52, 26, P.dR, '#9ff0ff');
  txt('SAUT', W - 60, 62, 16, '#ffffff', 'right');
  indicator(W - 52, 50, P.air, '#ffffff');
  if (tutoOn) LV_HINTS().forEach((line, j) => txt(line, 18, 120 + j * 28, 19, '#fff3a8', 'left'));
  if (storyT > 0 && !tutoOn) {
    storyT--;
    pixRect(40, H - 110, W - 80, 70, OUT);
    txt(CH_NAMES[Math.floor(idx / 10)], 60, H - 80, 18, '#ffe066', 'left');
    txt(STORY[Math.floor(idx / 10)] || '', 60, H - 56, 16, '#ffffff', 'left');
  }
  if (toastT > 0) { toastT--; txt(toast, W / 2, H - 22, 22, '#ffe066'); }

  if (fade > 0) {
    const cov = fade < 16 ? fade / 16 : (32 - fade) / 16, w = W * cov;
    ctx.fillStyle = OUT;
    ctx.fillRect(fade < 16 ? 0 : W - w, 0, w, H);
    if (fade >= 16 && fade < 28) txt(`Niveau ${fadeNext + 1}`, W / 2, H / 2, 44, '#ffffff');
  }
  if (mode === 'pause') drawPause();
  if (mode === 'win') {
    pixRect(0, 0, W, H, 'rgba(20,10,30,0.7)');
    txt('BRAVO !', W / 2, H / 2 - 30, 64, '#ffe066');
    txt(`Temps total ${fmt(wonT)} · Morts ${deaths}`, W / 2, H / 2 + 14, 24, '#ffffff');
    txt('Entrée : retour au menu', W / 2, H / 2 + 56, 20, '#ffffff');
  }
}
const LV_HINTS = () => (idx < BASE.length && BASE[idx].h) ? BASE[idx].h : [];

/* ================================================================
   SOURIS
   ================================================================ */
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
cv.addEventListener('mousemove', e => {
  [mx, my] = toCanvas(e);
  if (mode === 'menu') { hover = menuHit(mx, my); if (hover >= 0) sel = hover; }
  else if (mode === 'pause') { hover = pauseHit(mx, my); if (hover >= 0) pauseSel = hover; }
  else if (mode === 'skins') { hover = skinHit(mx, my); if (hover >= 0) skinCur = hover; }
  else hover = -1;
  cv.style.cursor = (mode === 'select' ? (rsHit(mx, my) >= 0 ? 'pointer' : 'default') : (hover >= 0 ? 'pointer' : 'default'));
});
cv.addEventListener('mouseleave', () => { hover = -1; });
cv.addEventListener('wheel', e => { if (mode === 'select') { e.preventDefault(); rsChangeChap(e.deltaY > 0 ? 1 : -1); } }, { passive: false });
cv.addEventListener('click', e => {
  ensureAudio();
  if (mpEl.classList.contains('on')) return;
  const [x, y] = toCanvas(e);
  if (mode === 'menu') { const i = menuHit(x, y); if (i >= 0) activate(i); }
  else if (mode === 'film') filmNext();
  else if (mode === 'pause') { const i = pauseHit(x, y); if (i >= 0) pauseAct(i); }
  else if (mode === 'skins') { const i = skinHit(x, y); if (i >= 0) chooseSkin(i); }
  else if (mode === 'select') {
    const r = rsHit(x, y);
    if (r < 0) return;
    if (r > roomMax) { say('Termine la salle précédente pour débloquer celle-ci'); return; }
    playRoomFrom(r);
  }
});

/* ================================================================
   CLAVIER
   ================================================================ */
addEventListener('keydown', e => {
  if (logOpen) { if (e.code === 'Escape' || e.code === 'Enter') closeLog(); return; }
  if (document.getElementById('ed').classList.contains('on')) { if (e.code === 'Escape') edClose(); return; }
  if (mpEl.classList.contains('on')) { if (e.code === 'Escape') mpClose(); return; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageDown', 'PageUp'].includes(e.code)) e.preventDefault();
  ensureAudio();
  if (e.code === 'KeyM') muted = !muted;
  if (e.repeat) { if (mode === 'select' && (e.code === 'ArrowDown' || e.code === 'ArrowUp')) scrollSel(e.code === 'ArrowDown' ? 60 : -60); return; }
  held[e.code] = true;
  if (mode === 'menu') {
    const n = MI().length;
    const digit = /^Digit([0-9])$/.exec(e.code);
    if (digit) activate(+digit[1] === 0 ? 9 : +digit[1] - 1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') sel = (sel + 1) % n;
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') sel = (sel - 1 + n) % n;
    else if (e.code === 'Enter') activate(sel);
  } else if (mode === 'select') {
    if (e.code === 'Escape' || e.code === 'Backspace') mode = 'menu';
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') rsChangeChap(-1);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') rsChangeChap(1);
    else if (e.code === 'Enter') { const f = chapRooms(rsChap).filter(r => r <= roomMax).pop(); if (f !== undefined) playRoomFrom(f); }
  } else if (mode === 'skins') {
    const n = SKINS.length;
    if (e.code === 'Escape' || e.code === 'Backspace') mode = 'menu';
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') skinCur = (skinCur + 1) % n;
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') skinCur = (skinCur - 1 + n) % n;
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') skinCur = (skinCur + 3) % n;
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') skinCur = (skinCur - 3 + n) % n;
    else if (e.code === 'Enter' || e.code === 'Space') chooseSkin(skinCur);
  } else if (mode === 'library') {
    libKey(e);
  } else if (mode === 'editor') {
    edKey(e);
  } else if (mode === 'film') {
    if (e.code === 'Escape') mode = 'menu';
    else if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') filmNext();
  } else if (mode === 'win') {
    if (e.code === 'Enter' || e.code === 'Escape') mode = 'menu';
  }
});
addEventListener('keyup', e => { held[e.code] = false; });
addEventListener('blur', () => { for (const key in held) held[key] = false; });

/* ================================================================
   BOUCLE
   ================================================================ */
function update() {
  tick++;
  shake *= 0.8;                                  // l'écran se calme après chaque secousse
  updWorld();
  if (remote && tick - remote.seen > 240) remote = null;
  if (tick % 90 === 0) send({ t: 'p', n: performance.now() });
  if (mode === 'film') filmTick();
  if (mode !== 'play') return;
  if (fade > 0) {
    if (++fade === 16) { fade = 17; goLevel(fadeNext); }
    if (fade >= 32) fade = 0;
    return;
  }
  if (P.dead) { runT += 1 / 60; if (--P.dead === 0) goLevel(idx); return; }
  runT += 1 / 60; levelT += 1 / 60;
  P.t++;
  if (P.blink > 0) P.blink--; else if (Math.random() < 0.008) P.blink = 6;
  if (P.freeze > 0) { P.freeze--; updHair(); return; }
  physics();
  if (mode !== 'play' || fade > 0 || P.dead) return;
  P.trail = P.trail.filter(q => --q.l > 0);
  updHair();
  trailFx();
  if (tick % 2 === 0) send({ t: 's', x: +P.x.toFixed(1), y: +P.y.toFixed(1), f: P.f, p: P.pose, k: skinSel, l: curL(), d: P.dead ? 1 : 0 });
}
const STEP = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(now - last, 100); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
buildEN();
requestAnimationFrame(loop);
</script>
